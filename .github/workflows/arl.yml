name: Genera ARL

on:
  schedule:
    - cron: '0 6 * * *'   # una volta al giorno, 06:00 UTC
  workflow_dispatch:       # trigger manuale dall'Actions tab

permissions:
  contents: write

concurrency:
  group: arl-gen
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps + Chromium
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Genera 10 ARL
        env:
          ARL_DAILY_COUNT: '1'
          ARL_KEEP_DAYS: '30'
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node generate.js

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_*.png
          if-no-files-found: ignore

      - name: Commit arls.json
        if: success()
        run: |
          git config user.name "arl-ecchino bot"
          git config user.email "actions@users.noreply.github.com"
          git add arls.json arl.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare"
          else
            git commit -m "ARL: $(date -u +%F) — aggiornamento automatico"
            git push
          fi