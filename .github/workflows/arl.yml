name: Genera ARL

on:
  schedule:
    - cron: '0 6 * * *'   # una volta al giorno, 06:00 UTC
  workflow_dispatch:       # trigger manuale dall'Actions tab

permissions:
  contents: write

concurrency:
  group: arl-gen
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm install

      - name: Debug secrets
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "TG_BOT_TOKEN set: $([ -n "$TG_BOT_TOKEN" ] && echo YES_${#TG_BOT_TOKEN}_chars || echo NO)"
          echo "TG_CHAT_ID set: $([ -n "$TG_CHAT_ID" ] && echo YES_${#TG_CHAT_ID}_chars || echo NO)"

      - name: Genera ARL
        env:
          ARL_DAILY_COUNT: '3'
          ARL_KEEP_DAYS: '30'
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node generate.js 2>&1 | tee run.log

      - name: Commit log + arls
        if: always()
        run: |
          git config user.name "arl-ecchino bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f run.log arls.json arl.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "run: $(date -u +%F_%H%M) log + arls"
            git push
          fi